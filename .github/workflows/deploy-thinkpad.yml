# Redeploy JobSync on the ThinkPad after a push.
#
# Joins the Tailnet as tag:ci (same OAuth pattern as creatuuls-lp), then uses
# Tailscale SSH (not a classic deploy key) — the ThinkPad has Tailscale SSH on
# :22, so appleboy/key auth gets "handshake failed: EOF".
# See docs/ci-tailscale-deploy.md

name: Deploy ThinkPad

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "prisma/**"
      - "scripts/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.override.yml"
      - "docker-entrypoint.sh"
      - "next.config.*"
      - ".github/workflows/deploy-thinkpad.yml"
  workflow_dispatch:

concurrency:
  group: deploy-thinkpad
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # Prefer Tailscale IP — MagicDNS often fails on GHA runners (same as creatuuls-lp).
          ping: ${{ vars.THINKPAD_TAILSCALE_IP }}

      - name: Deploy over Tailscale SSH
        env:
          HOST: ${{ vars.THINKPAD_TAILSCALE_IP }}
          SSH_USER: ${{ secrets.THINKPAD_USER }}
          APP_DIR: ${{ secrets.THINKPAD_APP_DIR }}
        run: |
          set -euo pipefail
          # Tailscale SSH authenticates the CI node by identity (tag:ci), not a key.
          # Requires ACL: grants tag:ci → tag:cms:22 AND ssh src tag:ci → tag:cms as SSH_USER.
          tailscale ssh "${SSH_USER}@${HOST}" \
            "set -euo pipefail
             cd \"${APP_DIR}\"
             echo \"Deploying in \$(pwd) on \$(hostname)\"
             git fetch origin
             git checkout main
             git pull --ff-only origin main
             if [ ! -f docker-compose.override.yml ]; then
               echo 'docker-compose.override.yml missing — refusing to pull GHCR-only image' >&2
               exit 1
             fi
             docker compose up -d --build --force-recreate
             docker compose ps
             echo Deploy finished"
